name: Reusable Trivy Scan
on:
  workflow_call:
    inputs:
      severity:
        default: HIGH,CRITICAL
        type: string
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: ${{ inputs.severity }}

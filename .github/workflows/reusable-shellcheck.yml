name: Reusable Shellcheck
on:
  workflow_call:
    inputs:
      severity:
        default: warning
        type: string
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S ${{ inputs.severity }} ./**/*.sh ./*.sh 2>/dev/null || shellcheck -S ${{ inputs.severity }} *.sh
      - name: Bash syntax check
        run: |
          for f in $(find . -name '*.sh' -not -path './.git/*'); do bash -n "$f"; done
          echo "SYNTAX_OK"
